# Rilis otomatis via release-please (manifest mode).
# Setiap push ke main: buka/perbarui Release PR (bump version.txt +
# frontend/package.json + lockfile, tulis CHANGELOG.md).
# Saat Release PR di-merge: tag vX.Y.Z + GitHub Release dibuat otomatis.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          command: manifest
